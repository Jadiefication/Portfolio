name: Build, Run, and Preview Site

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-build-and-run
  cancel-in-progress: true

jobs:
  build-and-run:
    name: Build and run server, capture snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 24
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build (skip tests)
        run: ./gradlew build -x test --no-daemon

      - name: Start server in background
        id: run_server
        run: |
          # Start the application in background
          ./gradlew run --no-daemon &
          echo $! > server.pid

      - name: Wait for server to be ready
        timeout-minutes: 2
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
              echo "Server is up"; exit 0;
            fi
            sleep 2
          done
          echo "Server did not start in time" >&2
          exit 1

      - name: Capture homepage HTML
        run: |
          mkdir -p site
          curl -fsS http://localhost:8080/ -o site/index.html

      - name: Copy static assets for preview (CSS, SVG)
        run: |
          mkdir -p site/css site/svg
          # Always copy favicon
          if [ -f src/main/resources/svg/favicon.svg ]; then
            cp src/main/resources/svg/favicon.svg site/svg/favicon.svg
            cp src/main/resources/svg/favicon.svg site/favicon.ico || true
          fi

          # Copy entire resources directories if present
          if [ -d src/main/resources/css ]; then cp -r src/main/resources/css/. site/css/ || true; fi
          if [ -d src/main/resources/svg ]; then cp -r src/main/resources/svg/. site/svg/ || true; fi

          # Copy CSS to root and default locations and to any UUID-based paths present in HTML
          if [ -f src/main/resources/css/style.css ]; then 
            # Place at root to satisfy href="/style.css" or "style.css"
            cp src/main/resources/css/style.css site/style.css
            cp src/main/resources/css/style.css site/styles.css
            # Place in css/ folder as both style.css and styles.css
            cp src/main/resources/css/style.css site/css/style.css
            cp src/main/resources/css/style.css site/css/styles.css

            # Detect all hrefs to *.css files in generated HTML
            css_matches=$(grep -oE "href=[\"'][^\"']*\.css[\"']" site/index.html | sed -E 's/href=[\"'\'']//g; s/[\"'\'']//g' | sort -u || true)
            if [ -n "$css_matches" ]; then
              while IFS= read -r css_path; do
                [ -z "$css_path" ] && continue
                # Skip external links
                if [[ "$css_path" =~ ^https?:// ]] || [[ "$css_path" =~ ^// ]]; then
                  continue
                fi
                # Normalize by stripping a leading /
                clean_path="${css_path#/}"
                mkdir -p "site/$(dirname "$clean_path")"
                cp src/main/resources/css/style.css "site/${clean_path}"
              done <<< "$css_matches"
            fi
          fi

          # Attempt to also fetch static assets from running server as fallback
          curl -fsS http://localhost:8080/style.css -o site/style.css || true
          curl -fsS http://localhost:8080/css/style.css -o site/css/style.css || true
          curl -fsS http://localhost:8080/svg/favicon.svg -o site/svg/favicon.svg || true

          # Normalize asset URLs in index.html for GitHub Pages (strip leading /)
          if [ -f site/index.html ]; then
            sed -i -E 's/href="\/([^":]+\.(css|svg|ico|png|jpg|jpeg|gif|js))"/href="\1"/g' site/index.html
            sed -i -E "s/href='\/([^':]+\.(css|svg|ico|png|jpg|jpeg|gif|js))'/href='\1'/g" site/index.html
            sed -i -E 's/href="\/(css\/[^\"]+|svg\/[^\"]+|js\/[^\"]+|img\/[^\"]+)"/href="\1"/g' site/index.html
            sed -i -E "s/href='\/(css\/[^']+|svg\/[^']+|js\/[^']+|img\/[^']+)'/href='\1'/g" site/index.html
            sed -i -E 's/src="\/([^":]+\.(css|svg|ico|png|jpg|jpeg|gif|js))"/src="\1"/g' site/index.html
            sed -i -E "s/src='\/([^':]+\.(css|svg|ico|png|jpg|jpeg|gif|js))'/src='\1'/g" site/index.html
            sed -i -E 's/src="\/(js\/[^\"]+|img\/[^\"]+|svg\/[^\"]+|css\/[^\"]+)"/src="\1"/g' site/index.html
            sed -i -E "s/src='\/(js\/[^']+|img\/[^']+|svg\/[^']+|css\/[^']+)'/src='\1'/g" site/index.html
          fi

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            PID=$(cat server.pid) || true
          fi
          # Try to stop Gradle daemon to ensure server stops
          ./gradlew --stop || true
          # Kill any remaining java processes started by this run step (best-effort)
          if [ -n "$PID" ]; then kill $PID || true; fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-snapshot
          path: site

  deploy-pages:
    name: Deploy snapshot to GitHub Pages (static preview)
    needs: build-and-run
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v8
        with:
          name: site-snapshot
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
