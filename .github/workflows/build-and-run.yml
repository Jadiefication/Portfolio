name: Build, Run, and Preview Site

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-build-and-run
  cancel-in-progress: true

jobs:
  build-and-run:
    name: Build and run server, capture snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build (skip tests)
        run: ./gradlew build -x test --no-daemon

      - name: Start server in background
        id: run_server
        run: |
          # Start the application in background
          ./gradlew run --no-daemon &
          echo $! > server.pid

      - name: Wait for server to be ready
        timeout-minutes: 2
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
              echo "Server is up"; exit 0;
            fi
            sleep 2
          done
          echo "Server did not start in time" >&2
          exit 1

      - name: Capture homepage HTML
        run: |
          mkdir -p site
          curl -fsS http://localhost:8080/ -o site/index.html

      - name: Copy static assets for preview (CSS, SVG)
        run: |
          mkdir -p site/css site/svg
          # Always copy favicon
          if [ -f src/main/resources/svg/favicon.svg ]; then cp src/main/resources/svg/favicon.svg site/svg/favicon.svg; fi

          # Copy CSS to default locations and to any UUID-based paths present in HTML
          if [ -f src/main/resources/css/style.css ]; then 
            # Fallback copies for simple paths
            cp src/main/resources/css/style.css site/css/style.css
            # Also place at root to satisfy href="/style.css" or "style.css"
            cp src/main/resources/css/style.css site/style.css

            # Detect all hrefs to /css/$uuid/styles.css (with or without leading slash) in generated HTML
            css_matches=$(grep -oE "/?css/[^\"']+/styles\.css" site/index.html | sort -u || true)
            if [ -n "$css_matches" ]; then
              while IFS= read -r css_path; do
                [ -z "$css_path" ] && continue
                # Normalize by stripping a leading /
                css_path="${css_path#/}"
                # Ensure directory exists and copy, renaming style.css -> styles.css as expected by the page
                mkdir -p "site/$(dirname "$css_path")"
                cp src/main/resources/css/style.css "site/${css_path}"
              done <<< "$css_matches"
            fi
          fi

          # Normalize asset URLs in index.html for GitHub Pages (strip leading /)
          if [ -f site/index.html ]; then
            sed -i -E 's/href="\/(css\/[^\"]+)"/href="\1"/g' site/index.html
            sed -i -E "s/href='\/(css\/[^']+)'/href='\1'/g" site/index.html
            sed -i -E 's/href="\/(svg\/[^\"]+)"/href="\1"/g' site/index.html
            sed -i -E "s/href='\/(svg\/[^']+)'/href='\1'/g" site/index.html
            sed -i -E 's/src="\/(js\/[^\"]+)"/src="\1"/g' site/index.html
            sed -i -E "s/src='\/(js\/[^']+)'/src='\1'/g" site/index.html
          fi

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            PID=$(cat server.pid) || true
          fi
          # Try to stop Gradle daemon to ensure server stops
          ./gradlew --stop || true
          # Kill any remaining java processes started by this run step (best-effort)
          if [ -n "$PID" ]; then kill $PID || true; fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-snapshot
          path: site

  deploy-pages:
    name: Deploy snapshot to GitHub Pages (static preview)
    needs: build-and-run
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: site-snapshot
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
